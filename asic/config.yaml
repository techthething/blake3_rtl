# LibreLane configuration: blake3_top on SkyWater 130 nm (sky130A, sky130_fd_sc_hd cells)
#
# Run from inside the LibreLane nix-shell:
#   librelane ~/blake3/asic/config.yaml
# Results go to asic/runs/RUN_<date>/; summarize them with:
#   python3 ~/blake3/asic/summarize.py
#
# The design is hardened as a block ("macro") meant to sit inside a larger chip:
# its 1000+ I/O pins are placed on the block edge, with no pads.

DESIGN_NAME: blake3_top

VERILOG_FILES:
  - dir::../rtl/blake3_g.sv
  - dir::../rtl/blake3_compress.sv
  - dir::../rtl/blake3_chunk.sv
  - dir::../rtl/blake3_tree.sv
  - dir::../rtl/blake3_arbiter.sv
  - dir::../rtl/blake3_top.sv

# blake3_assert.svh lives next to the RTL. Yosys defines SYNTHESIS itself, so
# the assertions are left out of the hardware, as in the FPGA flow.
VERILOG_INCLUDE_DIRS:
  - dir::../rtl

# Clock: the target the tools must meet. The real maximum is read from the
# slack afterwards:
#   max clock = 1000 / (CLOCK_PERIOD - worst setup slack)   MHz
#
# History: the first run used 40 ns with the default area-first synthesis. The
# compression round (12 chained 32-bit additions, ending at the 512 bits of
# state_q) came out about 51 ns long, and timing repair could only shave it
# slowly (WNS -11.9 -> -11.4 ns over 150 iterations), so it was stopped.
CLOCK_PORT: clk
CLOCK_PERIOD: 50

# Synthesis: optimize for speed instead of the default smallest area, and map
# additions to carry-select adders instead of ripple-carry. The critical path is
# a chain of 32-bit adders, so adder speed dominates.
SYNTH_STRATEGY: DELAY 1
SYNTH_ADDER_TYPE: CSA

# Floorplan: size the block so standard cells fill 40% of the core area,
# leaving room for routing (the design is wide: 512-bit datapaths).
FP_CORE_UTIL: 40
